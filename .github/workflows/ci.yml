name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install ruff==0.17.6
      - name: ruff
        working-directory: a1_iceberg_spoofing
        run: ruff check . --output-format github

  test-a1:
    runs-on: ubuntu-latest
    env:
      PYMARKETSIM_COMMIT: c300eec
    defaults:
      run:
        working-directory: a1_iceberg_spoofing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: a1_iceberg_spoofing/requirements.txt
      - name: Fetch PyMarketSim (pinned commit)
        run: |
          git clone --quiet https://github.com/dipplestix/pymarketsim.git "$RUNNER_TEMP/pymarketsim"
          git -C "$RUNNER_TEMP/pymarketsim" checkout --quiet "$PYMARKETSIM_COMMIT"
          echo "PYTHONPATH=$RUNNER_TEMP/pymarketsim" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      # Correctness tests. The golden-output regression test skips here: exact simulator values vary across
      # machines (see experiments/test_regression.py), so it is pinned only on the platform of the committed results.
      - name: pytest
        run: python -m pytest
